services:
  - type: web
    name: care-signal
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: GUARDIAN_CONNECTION_CODE
        sync: false
      - key: STAFF_ACCESS_CODE
        sync: false
      - key: DEVICE_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: DATABASE_URL
        fromDatabase:
          name: care-signal-db
          property: connectionString

databases:
  - name: care-signal-db
    plan: free
    region: singapore
    databaseName: care_signal
    user: care_signal
