<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Care Signal 병동 모니터</title>
  <style>
    :root{font-family:Inter,Pretendard,system-ui,sans-serif;color:#172033;background:#eef3f8;--normal:#16845b;--warning:#d47b09;--critical:#d43c4a;--muted:#667085}
    *{box-sizing:border-box}body{max-width:1440px;margin:0 auto;padding:28px 24px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}h1,h2,h3,p{margin-top:0}header p{color:var(--muted);margin-bottom:0}.card{background:#fff;border:1px solid #e5eaf0;border-radius:18px;padding:20px;box-shadow:0 10px 32px #1d293912}.dashboard{display:grid;grid-template-columns:minmax(560px,1.45fr) minmax(340px,1fr);gap:18px}.map-card{grid-row:span 2}.ward-heading{display:flex;align-items:center;justify-content:space-between;gap:12px}.legend{display:flex;gap:12px;font-size:13px;color:var(--muted)}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}.ward-map{position:relative;display:grid;grid-template-columns:repeat(6,1fr);grid-template-rows:repeat(5,86px);gap:10px;padding:16px;background:#f7f9fc;border:1px solid #e4eaf1;border-radius:16px;min-height:500px}.room,.station{border-radius:14px;padding:13px;text-align:left}.room{border:2px solid #d9e1e9;background:#fff;cursor:pointer;transition:.15s;display:flex;flex-direction:column;justify-content:space-between}.room:hover,.room.selected{transform:translateY(-2px);box-shadow:0 8px 20px #17203318}.room.selected{outline:3px solid #265ee833}.room.NORMAL{border-color:#7bc9aa;background:#edfbf5}.room.WARNING{border-color:#f0b45d;background:#fff7e8}.room.CRITICAL{border-color:#ee7b84;background:#fff0f1;animation:pulse 1.8s infinite}.room strong{font-size:18px}.room-state{font-weight:750}.room-meta{font-size:12px;color:var(--muted)}.station{background:#e9eef8;border:1px dashed #90a0b8;display:flex;align-items:center;justify-content:center;font-weight:700;color:#43516a}@keyframes pulse{50%{box-shadow:0 0 0 5px #d43c4a18}}.detail-head{display:flex;justify-content:space-between;gap:12px}.risk-badge{border-radius:999px;padding:6px 10px;font-size:12px;font-weight:800;height:max-content}.risk-badge.NORMAL{color:#08764e;background:#e4f7ef}.risk-badge.WARNING{color:#9b5600;background:#fff1d5}.risk-badge.CRITICAL{color:#b42434;background:#ffe1e5}.metric{font-size:31px;font-weight:850;margin:12px 0 4px}.subtle{color:var(--muted);font-size:13px}.history{display:grid;gap:8px;margin-top:15px;max-height:210px;overflow:auto}.history-item,.event{border:1px solid #e5e9f0;border-radius:12px;padding:12px}.history-item{display:flex;justify-content:space-between;gap:8px;font-size:13px}.events{display:grid;gap:10px;max-height:390px;overflow:auto}.event b.NORMAL{color:var(--normal)}.event b.WARNING{color:var(--warning)}.event b.CRITICAL{color:var(--critical)}button{border:0;border-radius:9px;padding:9px 12px;margin:6px 4px 0 0;cursor:pointer;background:#edf1f6;color:#253149}.primary{background:#265ee8;color:#fff}input{width:100%;padding:12px;border:1px solid #ccd3df;border-radius:9px}.demo{border-top:1px solid #e5e9f0;margin-top:16px;padding-top:14px}.error{color:#c33}.empty{color:var(--muted);padding:18px 4px;text-align:center}@media(max-width:980px){.dashboard{grid-template-columns:1fr}.map-card{grid-row:auto}}@media(max-width:680px){body{padding:18px 12px}.ward-map{grid-template-columns:repeat(2,1fr);grid-template-rows:auto;min-height:0}.room,.station{grid-column:auto!important;grid-row:auto!important;min-height:110px}.station{min-height:70px}.legend{display:none}}
  </style>
</head>
<body>
  <header><div><h1>Care Signal 병동 모니터</h1><p>WiFi CSI 기반 비영상 안전 모니터링</p></div><b id="clock"></b></header>
  <section id="staffLogin" class="card" style="max-width:420px;margin:20px auto"><h2>병원 직원 로그인</h2><input id="staffCode" type="password" placeholder="직원 인증 코드" value="NURSE-101"><button class="primary" onclick="staffLogin()" style="width:100%;margin-top:12px">로그인</button><p id="loginError" class="error"></p></section>
  <main id="dashboard" class="dashboard" style="display:none">
    <section class="card map-card">
      <div class="ward-heading"><div><small class="subtle">실시간 병동 현황</small><h2 id="wardName">병동 배치도</h2></div><div class="legend"><span><i class="dot" style="background:var(--normal)"></i>정상</span><span><i class="dot" style="background:var(--warning)"></i>주의</span><span><i class="dot" style="background:var(--critical)"></i>위험</span></div></div>
      <div id="wardMap" class="ward-map"><div class="empty">병동 정보를 불러오는 중…</div></div>
    </section>
    <section class="card">
      <div class="detail-head"><div><small id="selectedBed" class="subtle">침상</small><h2 id="selectedLabel">병실 선택</h2></div><span id="riskBadge" class="risk-badge NORMAL">정상</span></div>
      <div id="selectedState" class="metric">-</div><div id="selectedMeta" class="subtle">맵에서 병실을 선택하세요.</div>
      <div id="demoPanel" class="demo" style="display:none"><b>선택 병실 시연 제어</b><p class="subtle">실제 CSI 대신 가상 상태를 생성합니다.</p><button onclick="setDemoState('EMPTY')">환자 부재</button><button onclick="setDemoState('IN_BED')">침대 위</button><button onclick="setDemoState('OUT_OF_BED')">침대 이탈</button><button class="primary" onclick="setDemoState('MOVEMENT_ANOMALY')">이상 움직임</button><p id="demoResult" class="subtle"></p></div>
      <h3 style="margin-top:20px">최근 감지 기록</h3><div id="history" class="history"><div class="empty">기록이 없습니다.</div></div>
    </section>
    <section class="card"><h2>알림 및 대응</h2><div id="events" class="events">불러오는 중…</div></section>
  </main>
  <script>
    const labels={EMPTY:'부재',IN_BED:'침대 위',OUT_OF_BED:'침대 이탈',MOVEMENT_ANOMALY:'이상 움직임'};
    const riskLabels={NORMAL:'정상',WARNING:'주의',CRITICAL:'위험'};
    let selectedRoom='room-01',wardData=null,refreshing=false,lastMapSignature='';
    const staffHeaders=()=>({'Content-Type':'application/json',Authorization:`Bearer ${localStorage.getItem('staffToken')||''}`});
    const dateText=value=>value?new Date(value).toLocaleString():'기록 없음';
    async function staffLogin(){const r=await fetch('/api/v1/staff/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({access_code:document.querySelector('#staffCode').value})});if(!r.ok){document.querySelector('#loginError').textContent='인증 코드를 확인해 주세요.';return}const d=await r.json();localStorage.setItem('staffToken',d.access_token);localStorage.setItem('demoMode',String(d.demo_mode));showDashboard();updateDemoPanel()}
    function showDashboard(){document.querySelector('#staffLogin').style.display='none';document.querySelector('#dashboard').style.display='grid';refresh()}
    function selectRoom(roomId){selectedRoom=roomId;renderMap();renderSelected();loadHistory()}
    function renderMap(){if(!wardData)return;const signature=JSON.stringify([selectedRoom,wardData.rooms.map(room=>[room.room_id,room.status.state,room.status.confidence,room.status.updated_at])]);if(signature===lastMapSignature)return;lastMapSignature=signature;document.querySelector('#wardName').textContent=wardData.name;const rooms=wardData.rooms.map(room=>{const s=room.status;return `<button class="room ${s.risk_level} ${room.room_id===selectedRoom?'selected':''}" style="grid-column:${room.x}/span ${room.width};grid-row:${room.y}/span ${room.height}" onclick="selectRoom('${room.room_id}')"><span><strong>${room.label}</strong><br><small>${room.bed_label}</small></span><span><span class="room-state">${labels[s.state]||s.state}</span><br><span class="room-meta">신뢰도 ${Math.round(s.confidence*100)}%</span></span></button>`}).join('');const stations=wardData.stations.map(item=>`<div class="station" style="grid-column:${item.x}/span ${item.width};grid-row:${item.y}/span ${item.height}">${item.label}</div>`).join('');document.querySelector('#wardMap').innerHTML=rooms+stations}
    function renderSelected(){if(!wardData)return;const room=wardData.rooms.find(item=>item.room_id===selectedRoom)||wardData.rooms[0];if(!room)return;selectedRoom=room.room_id;const s=room.status;document.querySelector('#selectedBed').textContent=room.bed_label;document.querySelector('#selectedLabel').textContent=room.label;document.querySelector('#selectedState').textContent=labels[s.state]||s.state;document.querySelector('#selectedMeta').textContent=`신뢰도 ${Math.round(s.confidence*100)}% · 마지막 갱신 ${dateText(s.updated_at)}`;const badge=document.querySelector('#riskBadge');badge.textContent=riskLabels[s.risk_level]||s.risk_level;badge.className=`risk-badge ${s.risk_level}`}
    async function loadHistory(){const r=await fetch(`/api/v1/rooms/${selectedRoom}/history?limit=20`,{headers:staffHeaders()});if(!r.ok)return;const items=await r.json();document.querySelector('#history').innerHTML=items.length?items.map(item=>`<div class="history-item"><span><b>${labels[item.state]||item.state}</b> · ${Math.round(item.confidence*100)}%</span><time>${dateText(item.updated_at)}</time></div>`).join(''):'<div class="empty">아직 감지 기록이 없습니다.</div>'}
    async function setDemoState(state){const r=await fetch('/api/v1/demo/state',{method:'POST',headers:staffHeaders(),body:JSON.stringify({room_id:selectedRoom,state,confidence:.95})});document.querySelector('#demoResult').textContent=r.ok?`${labels[state]} 상태를 생성했습니다.`:'상태 생성에 실패했습니다.';if(r.ok)refresh()}
    async function patchEvent(id,status){await fetch(`/api/v1/events/${id}`,{method:'PATCH',headers:staffHeaders(),body:JSON.stringify({status,actor:'demo-nurse'})});refresh()}
    async function refresh(){if(refreshing)return;refreshing=true;try{const [mapResponse,eventResponse]=await Promise.all([fetch('/api/v1/ward/map',{headers:staffHeaders()}),fetch('/api/v1/events',{headers:staffHeaders()})]);if(mapResponse.status===401||eventResponse.status===401){localStorage.removeItem('staffToken');location.reload();return}if(!mapResponse.ok||!eventResponse.ok)throw new Error('병동 정보를 불러오지 못했습니다.');wardData=await mapResponse.json();const events=await eventResponse.json();renderMap();renderSelected();document.querySelector('#events').innerHTML=events.length?events.map(e=>{const room=wardData.rooms.find(item=>item.room_id===e.room_id);return `<article class="event"><b class="${e.risk_level}">${room?.label||e.room_id} · ${labels[e.event_type]||e.event_type}</b> · ${e.status}<br><small>${dateText(e.created_at)}</small><br>${['OPEN','ACKNOWLEDGED','RESPONDING'].includes(e.status)?`<button class="primary" onclick="patchEvent('${e.id}','ACKNOWLEDGED')">확인</button><button onclick="patchEvent('${e.id}','RESPONDING')">이동 중</button><button onclick="patchEvent('${e.id}','COMPLETED')">처리 완료</button><button onclick="patchEvent('${e.id}','FALSE_ALARM')">오탐</button>`:''}</article>`}).join(''):'<div class="empty">알림이 없습니다.</div>';await loadHistory()}catch(error){document.querySelector('#wardMap').innerHTML=`<div class="empty error">${error.message}</div>`}finally{refreshing=false}}
    function updateDemoPanel(){document.querySelector('#demoPanel').style.display=localStorage.getItem('demoMode')==='true'?'block':'none'}
    setInterval(()=>document.querySelector('#clock').textContent=new Date().toLocaleTimeString(),1000);setInterval(()=>{if(localStorage.getItem('staffToken'))refresh()},2500);if(localStorage.getItem('staffToken'))showDashboard();updateDemoPanel();
  </script>
</body>
</html>
