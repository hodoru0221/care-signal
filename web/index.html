<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Care Signal 병동 모니터</title>
  <style>
    [hidden]{display:none!important}
    :root{font-family:Inter,Pretendard,"Noto Sans KR",system-ui,sans-serif;color:#152238;background:#eef3f8;--normal:#087a54;--warning:#9a5700;--critical:#b42335;--primary:#2056d9;--muted:#5d6b7e;--line:#dce4ed}*{box-sizing:border-box}body{max-width:1440px;margin:auto;padding:24px}button,input{font:inherit}button{cursor:pointer}.skip{position:absolute;left:-9999px}.skip:focus{left:16px;top:12px;z-index:9;background:#fff;padding:10px;border-radius:8px}header{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:18px}h1,h2,h3,p{margin-top:0}h1{margin-bottom:4px;font-size:clamp(24px,3vw,34px)}header p{color:var(--muted);margin:0}.clock-wrap{text-align:right}.clock-wrap small{display:block;color:var(--muted)}#clock{font-variant-numeric:tabular-nums}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:0 8px 28px #1d29390d}.dashboard{display:grid;grid-template-columns:minmax(540px,1.45fr) minmax(340px,1fr);gap:18px}.map-card{grid-row:span 3}.ward-heading,.detail-head,.section-head,.ops-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}.eyebrow{color:var(--primary);font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}.legend{display:flex;flex-wrap:wrap;gap:8px;font-size:12px;color:var(--muted)}.legend span,.status-pill{border:1px solid var(--line);border-radius:999px;padding:5px 8px}.state-icon{font-weight:900;margin-right:4px}.NORMAL .state-icon,.event.NORMAL .event-title{color:var(--normal)}.WARNING .state-icon,.event.WARNING .event-title{color:var(--warning)}.CRITICAL .state-icon,.event.CRITICAL .event-title{color:var(--critical)}.ward-map{display:grid;grid-template-columns:repeat(6,1fr);grid-template-rows:repeat(5,88px);gap:10px;padding:16px;background:#f7f9fc;border:1px solid var(--line);border-radius:16px;min-height:510px}.room,.station{border-radius:14px;padding:13px;text-align:left}.room{border:2px solid #ccd6e2;background:#fff;color:inherit;display:flex;flex-direction:column;justify-content:space-between;transition:.15s}.room:hover{transform:translateY(-2px);box-shadow:0 8px 20px #17203318}.room:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid #2056d966;outline-offset:3px}.room[aria-pressed="true"]{outline:3px solid var(--primary);outline-offset:2px}.room.NORMAL{border-color:#65b99a;background:#effaf6}.room.WARNING{border-color:#df9b42;background:#fff8e8}.room.CRITICAL{border-color:#db6672;background:#fff1f2}.room strong{font-size:19px}.room-state{font-weight:800}.room-meta,.subtle{color:var(--muted);font-size:13px}.station{background:#e8edf5;border:1px dashed #8595aa;display:flex;align-items:center;justify-content:center;font-weight:750;color:#34445c}.risk-badge,.health-badge{border-radius:999px;padding:7px 11px;font-size:13px;font-weight:850}.risk-badge.NORMAL,.health-badge.online{color:#066a49;background:#dff5ec}.risk-badge.WARNING,.health-badge.delayed{color:#784500;background:#fff0cf}.risk-badge.CRITICAL,.health-badge.offline{color:#971f2e;background:#ffdde1}.metric{font-size:clamp(26px,4vw,34px);font-weight:850;margin:14px 0 5px}.history,.events{display:grid;gap:9px;overflow:auto;overscroll-behavior:contain}.history{margin-top:12px;max-height:230px}.events{max-height:430px}.history-item,.event{border:1px solid var(--line);border-radius:12px;padding:12px}.history-item{display:flex;justify-content:space-between;gap:12px;font-size:13px}.history-item time,.event time{color:var(--muted);font-variant-numeric:tabular-nums}.event-title{font-weight:850}.event-meta{display:flex;justify-content:space-between;gap:8px;margin:6px 0 8px;font-size:12px}.event-actions{display:flex;flex-wrap:wrap;gap:6px}button.action{border:1px solid #d7dfe9;border-radius:8px;padding:8px 10px;background:#f1f4f8;color:#253149}.primary{background:var(--primary)!important;color:#fff!important;border-color:var(--primary)!important}.login{max-width:420px;margin:32px auto}.login label{display:block;font-weight:700;margin-bottom:8px}input{width:100%;padding:12px;border:1px solid #aeb9c7;border-radius:9px}.login button{width:100%;margin-top:12px}.demo{border-top:1px solid var(--line);margin-top:16px;padding-top:14px}.demo button{margin:4px 3px}.error{color:#a51d2b}.empty{color:var(--muted);padding:18px 4px;text-align:center}.refresh-status{min-height:20px;text-align:right}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}.ops-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px}.ops-item{background:#f7f9fc;border:1px solid var(--line);border-radius:12px;padding:11px;min-width:0}.ops-item dt{font-size:12px;color:var(--muted);margin-bottom:5px}.ops-item dd{margin:0;font-weight:750;overflow-wrap:anywhere}.ops-item.wide{grid-column:1/-1}.stale-warning{margin:12px 0 0;padding:10px 12px;border-radius:10px;background:#fff2d8;color:#784500;font-weight:700}.ops-note{margin:12px 0 0}.health-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.health-badge{display:inline-block}.health-badge.unknown{color:#4f5d70;background:#e9eef4}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}@media(max-width:980px){.dashboard{grid-template-columns:1fr}.map-card{grid-row:auto}}@media(max-width:680px){body{padding:16px 12px}header{align-items:flex-start}.clock-wrap small{display:none}.card{padding:15px}.ward-heading{display:block}.legend{margin:10px 0}.ward-map{grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:auto;min-height:0;padding:10px}.room,.station{grid-column:auto!important;grid-row:auto!important;min-height:116px}.station{min-height:62px}.history-item,.event-meta{flex-direction:column;gap:3px}.dashboard{gap:12px}.ops-grid{grid-template-columns:1fr}.ops-item.wide{grid-column:auto}}
  </style>
</head>
<body>
  <a class="skip" href="#wardMap">병동 현황으로 건너뛰기</a>
  <header><div><h1>Care Signal</h1><p>WiFi CSI 기반 비접촉 병동 안전 모니터링</p></div><div class="clock-wrap"><small>현재 시각</small><b id="clock" aria-live="off"></b><button class="action" id="logoutButton" hidden>로그아웃</button></div></header>
  <section id="staffLogin" class="card login" aria-labelledby="loginTitle"><h2 id="loginTitle">병원 직원 로그인</h2><label for="staffCode">직원 인증 코드</label><input id="staffCode" type="password" autocomplete="current-password"><button class="action primary" id="loginButton">로그인</button><p id="loginError" class="error" role="alert"></p></section>
  <main id="dashboard" class="dashboard" hidden>
    <section class="card map-card" aria-labelledby="wardName"><div class="ward-heading"><div><span class="eyebrow">실시간 병동 현황</span><h2 id="wardName">병동 배치도</h2></div><div class="legend" aria-label="위험도 범례"><span><b class="state-icon">●</b>정상</span><span><b class="state-icon">!</b>주의</span><span><b class="state-icon">▲</b>위험</span></div></div><p id="refreshStatus" class="subtle refresh-status" role="status" aria-live="polite"></p><div id="wardMap" class="ward-map" aria-label="병동 배치"><div class="empty">병동 정보를 불러오는 중…</div></div></section>
    <section class="card" aria-labelledby="selectedLabel"><div class="detail-head"><div><span id="selectedBed" class="subtle">침상</span><h2 id="selectedLabel">병실 선택</h2></div><span id="riskBadge" class="risk-badge NORMAL">정상</span></div><div id="selectedState" class="metric">-</div><div id="selectedMeta" class="subtle">맵에서 병실을 선택하세요.</div><div id="demoPanel" class="demo" hidden><b>선택 병실 시연 제어</b><p class="subtle">실제 CSI 데이터 대신 상태를 생성합니다.</p><button class="action" data-demo="EMPTY">부재</button><button class="action" data-demo="IN_BED">침상 내</button><button class="action" data-demo="OUT_OF_BED">침상 이탈</button><button class="action primary" data-demo="MOVEMENT_ANOMALY">이상 움직임</button><p id="demoResult" class="subtle" role="status"></p></div><h3 style="margin-top:20px">최근 감지 기록</h3><div id="history" class="history"><div class="empty">기록이 없습니다.</div></div></section>
    <section class="card" aria-labelledby="opsTitle"><div class="ops-head"><div><span class="eyebrow">모델 · 장치 운영</span><h2 id="opsTitle">선택 병실 신호 상태</h2></div><span id="deviceHealth" class="health-badge unknown">확인 중</span></div><div id="opsContent" aria-live="off"><p class="ops-note subtle">운영 정보를 불러오는 중…</p></div></section>
    <section class="card" aria-labelledby="eventsTitle"><div class="section-head"><h2 id="eventsTitle">알림 및 대응</h2><span id="eventCount" class="status-pill">0건</span></div><div id="events" class="events" aria-live="polite"><div class="empty">불러오는 중…</div></div></section>
  </main>
  <script>
    const labels={EMPTY:'부재',IN_BED:'침상 내',OUT_OF_BED:'침상 이탈',MOVEMENT_ANOMALY:'이상 움직임'},riskLabels={NORMAL:'정상',WARNING:'주의',CRITICAL:'위험'},riskIcons={NORMAL:'●',WARNING:'!',CRITICAL:'▲'},statusLabels={OPEN:'미확인',ACKNOWLEDGED:'확인',RESPONDING:'이동 중',COMPLETED:'처리 완료',FALSE_ALARM:'오탐'};
    let selectedRoom='room-01',wardData=null,refreshing=false,lastMapSignature='',historyRequest=0,opsRequest=0,deviceCache=[];
    const $=s=>document.querySelector(s),staffHeaders=()=>({'Content-Type':'application/json',Authorization:`Bearer ${localStorage.getItem('staffToken')||''}`}),escapeHtml=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
    const parseDate=v=>{const d=v?new Date(v):null;return d&&!Number.isNaN(d.getTime())?d:null},dateText=v=>{const d=parseDate(v);return d?d.toLocaleString('ko-KR',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}):'기록 없음'},relativeText=v=>{const d=parseDate(v);if(!d)return '수신 기록 없음';const sec=Math.max(0,Math.floor((Date.now()-d)/1000));if(sec<60)return `${sec}초 전`;if(sec<3600)return `${Math.floor(sec/60)}분 전`;if(sec<86400)return `${Math.floor(sec/3600)}시간 전`;return `${Math.floor(sec/86400)}일 전`};
    async function staffLogin(){const button=$('#loginButton');button.disabled=true;$('#loginError').textContent='';try{const r=await fetch('/api/v1/staff/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({access_code:$('#staffCode').value})});if(!r.ok)throw new Error('인증 코드를 확인해 주세요.');const d=await r.json();localStorage.setItem('staffToken',d.access_token);localStorage.setItem('demoMode',String(d.demo_mode));showDashboard();updateDemoPanel()}catch(e){$('#loginError').textContent=e.message}finally{button.disabled=false}}
    function showDashboard(){$('#staffLogin').hidden=true;$('#dashboard').hidden=false;$('#logoutButton').hidden=false;refresh()}
    async function staffLogout(){const token=localStorage.getItem('staffToken');localStorage.removeItem('staffToken');localStorage.removeItem('demoMode');if(token)try{await fetch('/api/v1/staff/logout',{method:'POST',headers:{Authorization:`Bearer ${token}`}})}catch{}location.reload()}
    function selectRoom(roomId){if(roomId===selectedRoom)return;selectedRoom=roomId;renderMap();renderSelected();loadHistory();loadOperations()}
    function renderMap(){if(!wardData)return;const signature=JSON.stringify([selectedRoom,wardData.rooms.map(r=>[r.room_id,r.status.state,r.status.confidence,r.status.updated_at])]);if(signature===lastMapSignature)return;lastMapSignature=signature;$('#wardName').textContent=wardData.name;$('#wardMap').innerHTML=wardData.rooms.map(room=>{const s=room.status,selected=room.room_id===selectedRoom,label=`${room.label}, ${room.bed_label}, ${riskLabels[s.risk_level]||s.risk_level}, ${labels[s.state]||s.state}, 신뢰도 ${Math.round(s.confidence*100)}%`;return `<button class="room ${s.risk_level}" style="grid-column:${room.x}/span ${room.width};grid-row:${room.y}/span ${room.height}" data-room="${escapeHtml(room.room_id)}" aria-pressed="${selected}" aria-label="${escapeHtml(label)}"><span><strong>${escapeHtml(room.label)}</strong><br><small>${escapeHtml(room.bed_label)}</small></span><span><span class="room-state"><b class="state-icon" aria-hidden="true">${riskIcons[s.risk_level]||'•'}</b>${escapeHtml(labels[s.state]||s.state)}</span><br><span class="room-meta">신뢰도 ${Math.round(s.confidence*100)}%</span></span></button>`}).join('')+(wardData.stations||[]).map(i=>`<div class="station" style="grid-column:${i.x}/span ${i.width};grid-row:${i.y}/span ${i.height}">${escapeHtml(i.label)}</div>`).join('')}
    function selectedRoomData(){return wardData?.rooms.find(i=>i.room_id===selectedRoom)||wardData?.rooms[0]}
    function renderSelected(){const room=selectedRoomData();if(!room)return;selectedRoom=room.room_id;const s=room.status;$('#selectedBed').textContent=room.bed_label;$('#selectedLabel').textContent=room.label;$('#selectedState').textContent=labels[s.state]||s.state;$('#selectedMeta').textContent=`신뢰도 ${Math.round(s.confidence*100)}% · 마지막 갱신 ${dateText(s.updated_at)}`;const b=$('#riskBadge');b.textContent=`${riskIcons[s.risk_level]||''} ${riskLabels[s.risk_level]||s.risk_level}`;b.className=`risk-badge ${s.risk_level}`}
    async function loadHistory(){const request=++historyRequest,roomId=selectedRoom;$('#history').setAttribute('aria-busy','true');try{const r=await fetch(`/api/v1/rooms/${encodeURIComponent(roomId)}/history?limit=20`,{headers:staffHeaders()});if(!r.ok)throw new Error();const items=await r.json();if(request!==historyRequest||roomId!==selectedRoom)return;$('#history').innerHTML=items.length?items.map(i=>`<div class="history-item"><span><b>${escapeHtml(labels[i.state]||i.state)}</b> · 신뢰도 ${Math.round(i.confidence*100)}%</span><time datetime="${escapeHtml(i.updated_at)}">${dateText(i.updated_at)}</time></div>`).join(''):'<div class="empty">아직 감지 기록이 없습니다.</div>'}catch{if(request===historyRequest)$('#history').innerHTML='<div class="empty error">기록을 불러오지 못했습니다.</div>'}finally{if(request===historyRequest)$('#history').removeAttribute('aria-busy')}}
    function asList(payload){if(Array.isArray(payload))return payload;for(const key of ['devices','items','statuses','data'])if(Array.isArray(payload?.[key]))return payload[key];return payload&&typeof payload==='object'?[payload]:[]}
    function deviceFor(roomId,observation){return deviceCache.find(d=>String(d.device_id??d.id)==String(observation?.device_id))||deviceCache.find(d=>d.room_id===roomId)||null}
    function healthOf(device,lastAt){const raw=String(device?.status??device?.state??'').toLowerCase(),online=device?.online;const last=parseDate(device?.last_received_at??device?.received_at??device?.last_seen_at??lastAt),age=last?(Date.now()-last.getTime())/1000:Infinity;if(online===false||['offline','disconnected','error'].includes(raw)||age>300)return {key:'offline',text:'오프라인'};if(['delayed','stale','degraded'].includes(raw)||age>60)return {key:'delayed',text:'지연'};if(online===true||['online','connected','healthy'].includes(raw)||age<=60)return {key:'online',text:'온라인'};return {key:'unknown',text:'상태 미확인'}}
    function renderOperations(observation,device,unavailable=false){const health=healthOf(device,observation?.received_at),badge=$('#deviceHealth');badge.className=`health-badge ${health.key}`;badge.textContent=health.text;const captured=observation?.captured_at,received=device?.last_received_at??device?.received_at??device?.last_seen_at??observation?.received_at,stale=!parseDate(captured)||Date.now()-parseDate(captured).getTime()>60000;$('#opsContent').innerHTML=`${stale?'<p class="stale-warning" role="status">⚠ 모델 데이터가 오래됐습니다. 현장 상태를 직접 확인하세요.</p>':''}<dl class="ops-grid"><div class="ops-item"><dt>최근 모델 판정</dt><dd>${escapeHtml(observation?labels[observation.state]||observation.state:'기록 없음')}</dd></div><div class="ops-item"><dt>신뢰도</dt><dd>${observation&&Number.isFinite(Number(observation.confidence))?`${Math.round(Number(observation.confidence)*100)}%`:'-'}</dd></div><div class="ops-item"><dt>장치 상태</dt><dd>${escapeHtml(health.text)}</dd></div><div class="ops-item"><dt>마지막 수신</dt><dd>${escapeHtml(relativeText(received))}</dd></div><div class="ops-item"><dt>모델 버전</dt><dd>${escapeHtml(observation?.model_version||'-')}</dd></div><div class="ops-item"><dt>처리 지연</dt><dd>${parseDate(captured)&&parseDate(observation?.received_at)?`${Math.max(0,Math.round((parseDate(observation.received_at)-parseDate(captured))/1000))}초`:'-'}</dd></div></dl>${unavailable?'<p class="ops-note subtle">운영 API에 연결할 수 없어 마지막으로 확인된 정보만 표시합니다.</p>':''}`}
    async function loadOperations(){const request=++opsRequest,roomId=selectedRoom;$('#opsContent').setAttribute('aria-busy','true');try{const [o,d]=await Promise.allSettled([fetch(`/api/v1/observations?room_id=${encodeURIComponent(roomId)}&limit=20`,{headers:staffHeaders()}),fetch('/api/v1/devices/status',{headers:staffHeaders()})]);let observations=[],failed=false;if(o.status==='fulfilled'&&o.value.ok)observations=asList(await o.value.json());else failed=true;if(d.status==='fulfilled'&&d.value.ok)deviceCache=asList(await d.value.json());else failed=true;if(request!==opsRequest||roomId!==selectedRoom)return;const latest=observations.slice().sort((a,b)=>(parseDate(b.captured_at)?.getTime()||0)-(parseDate(a.captured_at)?.getTime()||0))[0]||null;renderOperations(latest,deviceFor(roomId,latest),failed)}catch{if(request===opsRequest&&roomId===selectedRoom)renderOperations(null,deviceFor(roomId,null),true)}finally{if(request===opsRequest)$('#opsContent').removeAttribute('aria-busy')}}
    async function setDemoState(state){const r=await fetch('/api/v1/demo/state',{method:'POST',headers:staffHeaders(),body:JSON.stringify({room_id:selectedRoom,state,confidence:.95})});$('#demoResult').textContent=r.ok?`${labels[state]} 상태를 생성했습니다.`:'상태 생성에 실패했습니다.';if(r.ok)refresh()}
    async function patchEvent(id,status){await fetch(`/api/v1/events/${encodeURIComponent(id)}`,{method:'PATCH',headers:staffHeaders(),body:JSON.stringify({status,actor:'demo-nurse'})});refresh()}
    function renderEvents(events){$('#eventCount').textContent=`${events.length}건`;$('#events').innerHTML=events.length?events.map(e=>{const room=wardData.rooms.find(i=>i.room_id===e.room_id),active=['OPEN','ACKNOWLEDGED','RESPONDING'].includes(e.status);return `<article class="event ${e.risk_level}"><div class="event-title"><span class="state-icon" aria-hidden="true">${riskIcons[e.risk_level]||'•'}</span>${escapeHtml(room?.label||e.room_id)} · ${escapeHtml(labels[e.event_type]||e.event_type)}</div><div class="event-meta"><span>${escapeHtml(statusLabels[e.status]||e.status)}</span><time datetime="${escapeHtml(e.created_at)}">${dateText(e.created_at)}</time></div>${active?`<div class="event-actions"><button class="action primary" data-event="${escapeHtml(e.id)}" data-status="ACKNOWLEDGED">확인</button><button class="action" data-event="${escapeHtml(e.id)}" data-status="RESPONDING">이동 중</button><button class="action" data-event="${escapeHtml(e.id)}" data-status="COMPLETED">처리 완료</button><button class="action" data-event="${escapeHtml(e.id)}" data-status="FALSE_ALARM">오탐</button></div>`:''}</article>`}).join(''):'<div class="empty">현재 알림이 없습니다.</div>'}
    async function refresh(){if(refreshing||document.hidden)return;refreshing=true;$('#refreshStatus').textContent='업데이트 중…';try{const [m,e]=await Promise.all([fetch('/api/v1/ward/map',{headers:staffHeaders()}),fetch('/api/v1/events',{headers:staffHeaders()})]);if(m.status===401||e.status===401){localStorage.removeItem('staffToken');location.reload();return}if(!m.ok||!e.ok)throw new Error();wardData=await m.json();const events=await e.json();renderMap();renderSelected();renderEvents(events);await Promise.all([loadHistory(),loadOperations()]);$('#refreshStatus').classList.remove('error');$('#refreshStatus').textContent=`${new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit',second:'2-digit'})} 갱신됨`}catch{$('#refreshStatus').textContent='갱신 실패 · 잠시 뒤 자동 재시도';$('#refreshStatus').classList.add('error')}finally{refreshing=false}}
    function updateDemoPanel(){$('#demoPanel').hidden=localStorage.getItem('demoMode')!=='true'}
    $('#loginButton').addEventListener('click',staffLogin);$('#logoutButton').addEventListener('click',staffLogout);$('#staffCode').addEventListener('keydown',e=>{if(e.key==='Enter')staffLogin()});$('#wardMap').addEventListener('click',e=>{const b=e.target.closest('[data-room]');if(b)selectRoom(b.dataset.room)});$('#demoPanel').addEventListener('click',e=>{const b=e.target.closest('[data-demo]');if(b)setDemoState(b.dataset.demo)});$('#events').addEventListener('click',e=>{const b=e.target.closest('[data-event]');if(b)patchEvent(b.dataset.event,b.dataset.status)});document.addEventListener('visibilitychange',()=>{if(!document.hidden&&localStorage.getItem('staffToken'))refresh()});setInterval(()=>$('#clock').textContent=new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'}),1000);setInterval(()=>{if(localStorage.getItem('staffToken'))refresh()},5000);$('#clock').textContent=new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'});if(localStorage.getItem('staffToken'))showDashboard();updateDemoPanel();
    $('#wardMap').addEventListener('keydown',e=>{const b=e.target.closest('[data-room]');if(b&&(e.key==='Enter'||e.key===' ')){e.preventDefault();selectRoom(b.dataset.room)}});
