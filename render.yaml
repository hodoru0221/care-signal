services:
  - type: web
    name: care-signal
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: GUARDIAN_CONNECTION_CODE
        sync: false
      - key: STAFF_ACCESS_CODE
        sync: false
      - key: DEVICE_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        value: "https://care-signal.onrender.com"
      - key: DEMO_MODE
        value: "true"
      - key: GUARDIAN_SESSION_DAYS
        value: "30"
      - key: STAFF_SESSION_HOURS
        value: "12"
      # Neon is the primary database when this secret is configured in Render.
      - key: NEON_DATABASE_URL
        sync: false
      # Keep the legacy database connected for a safe one-time data copy.
      # It is read only when Neon has no monitoring snapshot yet.
      - key: DATABASE_URL
        fromDatabase:
          name: care-signal-db
          property: connectionString

databases:
  # Legacy fallback retained until Neon is verified; this resource is not deleted.
  - name: care-signal-db
    plan: free
    region: singapore
    databaseName: care_signal
    user: care_signal

