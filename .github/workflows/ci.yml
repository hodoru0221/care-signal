name: Software CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: software-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend and gateway
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-test.txt
      - name: Install Python dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Run automated tests
        run: python -m unittest discover -s tests -v
      - name: Compile Python sources
        run: python -m compileall -q backend gateway tools

  frontend:
    name: Web and guardian mobile
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.16.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22.14.0"
          cache: pnpm
          cache-dependency-path: mobile/pnpm-lock.yaml
      - name: Install mobile dependencies
        run: pnpm install --frozen-lockfile
      - name: Type-check guardian app
        run: pnpm run typecheck
      - name: Check inline web scripts
        working-directory: .
        run: >-
          node -e "const fs=require('fs');for(const file of ['web/index.html','web/guardian.html']){const html=fs.readFileSync(file,'utf8');const scripts=[...html.matchAll(/<script[^>]*>([\s\S]*?)<\/script>/gi)];scripts.forEach(([_,source])=>new Function(source));console.log(file+': '+scripts.length+' script(s) OK')}"
